<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>登录失败</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #f44336, #ff7961);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            border-radius: 16px;
            padding: 32px 40px;
            box-shadow: 0 18px 45px rgba(0,0,0,0.18);
            text-align: center;
            max-width: 360px;
            width: 100%;
        }
        .icon {
            font-size: 40px;
            color: #f44336;
            margin-bottom: 16px;
        }
        h1 {
            margin: 0 0 8px;
            font-size: 24px;
            color: #222;
        }
        p {
            margin: 0 0 20px;
            color: #666;
            font-size: 14px;
        }
        a.button {
            display: inline-block;
            padding: 10px 22px;
            border-radius: 999px;
            background: #f44336;
            color: #fff;
            text-decoration: none;
            font-size: 14px;
        }
        a.button:hover {
            background: #e53935;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="icon">✖</div>
    <h1>登录失败</h1>
    <p>用户名或密码不正确，请重试。</p>
    <a class="button" href="/">返回登录页</a>
</div>
</body>
</html>
