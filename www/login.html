<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>登录</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #3f51b5, #5c6bc0);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            border-radius: 16px;
            padding: 32px 40px;
            box-shadow: 0 18px 45px rgba(0,0,0,0.18);
            text-align: center;
            max-width: 360px;
            width: 100%;
        }
        h1 {
            margin: 0 0 16px;
            font-size: 24px;
            color: #222;
        }
        .field {
            margin-bottom: 16px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 4px;
            font-size: 13px;
            color: #555;
        }
        input {
            width: 100%;
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
            box-sizing: border-box;
        }
        button {
            margin-top: 8px;
            width: 100%;
            padding: 10px 0;
            border-radius: 999px;
            border: none;
            background: #3f51b5;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }
        button:hover {
            background: #3949ab;
        }
        .hint {
            margin-top: 12px;
            font-size: 12px;
            color: #777;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>用户登录</h1>
    <!--
      这里约定：
      - action="/" ：提交到根路径
      - method="POST" ：使用 POST 请求
      - input 的 name 分别是 username / password
      对应后端对 req.body 的解析逻辑：username=...&password=...
    -->
    <form action="/" method="POST">
        <div class="field">
            <label for="username">账号</label>
            <input id="username" name="username" autocomplete="username" />
        </div>
        <div class="field">
            <label for="password">密码</label>
            <input id="password" name="password" type="password" autocomplete="current-password" />
        </div>
        <button type="submit">登录</button>
        <div class="hint">测试账号：admin / 123456</div>
    </form>
</div>
</body>
</html>
